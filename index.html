<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Followers</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #fafafa;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.box {
  width: 350px;
  background: white;
  border: 1px solid #ddd;
  padding: 35px 28px;
  text-align: center;
}

.logo {
  font-family: cursive;
  font-size: 42px;
  font-weight: bold;
  margin-bottom: 25px;
}

input, select, button {
  width: 100%;
  height: 44px;
  margin-bottom: 10px;
  border-radius: 6px;
  font-size: 14px;
}

input, select {
  border: 1px solid #ddd;
  padding: 0 12px;
  background: #fafafa;
}

button {
  border: none;
  background: #0095f6;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.notice {
  color: #777;
  font-size: 12px;
  line-height: 1.5;
  margin-top: 12px;
}

.result {
  display: none;
  margin-top: 20px;
  padding: 15px;
  background: #f5f5f5;
  border-radius: 8px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">Instagram</div>

  <input
    type="text"
    id="username"
    placeholder="Username"
    autocomplete="off"
  >

  <!-- Visual-only password field:
       JavaScript never reads this value. -->
  <input
    type="password"
    placeholder="Password"
    autocomplete="off"
  >

  <select id="amount">
    <option value="">Select followers</option>
    <option>100 followers</option>
    <option>200 followers</option>
    <option>300 followers</option>
    <option>400 followers</option>
    <option>500 followers</option>
    <option>600 followers</option>
    <option>700 followers</option>
    <option>800 followers</option>
    <option>900 followers</option>
    <option>1000 followers</option>
  </select>

  <button onclick="processRequest()">
    Get Free Followers
  </button>

  <div class="notice">
    Don't worry, we don't keep your data.
  </div>

  <div class="result" id="result"></div>

</div>

<script>
function processRequest() {

  // Only the username and follower selection are used.
  // The password field is NEVER accessed.

  const username =
    document.getElementById("username").value.trim();

  const amount =
    document.getElementById("amount").value;

  const result =
    document.getElementById("result");

  if (!username || !amount) {
    result.style.display = "block";
    result.textContent =
      "Please enter your username and select a follower amount.";
    return;
  }

  result.style.display = "block";
  result.innerHTML = "Processing...";

  setTimeout(() => {
    result.innerHTML =
      "<b>Done!</b><br><br>" +
      "Your request for @" +
      escapeHTML(username) +
      " (" + escapeHTML(amount) + ") " +
      "has been processed.<br><br>" +
      "It will be processed within 24 hours.";
  }, 1500);
}

function escapeHTML(text) {
  return text.replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[c]));
}
</script>

</body>
</html>
